
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Sistema de Notas</h1>
        <p>Consulte a média e a situação do estudante.</p>

        <label>Nome do estudante:</label>
        <input type="text" id="nome" placeholder="Digite o nome">

        <label>Primeira nota:</label>
        <input type="number" id="nota1" placeholder="Nota de 0 a 10" min="0" max="10" step="any">

        <label>Segunda nota:</label>
        <input type="number" id="nota2" placeholder="Nota de 0 a 10" min="0" max="10" step="any">

        <label>Terceira nota:</label>
        <input type="number" id="nota3" placeholder="Nota de 0 a 10" min="0" max="10" step="any">

        <button onclick="calcularMedia()">Calcular média</button>
        <button onclick="limparCampos()" class="limpar">Limpar</button>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
